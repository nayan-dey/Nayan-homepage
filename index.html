<!doctype html>

    <meta charset="UTF-8" />

      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#101113" />
    <script>
      // Runs before paint: pick the theme (saved choice, else the OS) and the view from the
      // URL hash, so the first frame is already right and nothing flashes.
      (function () {
        var h = document.documentElement, t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        h.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = t === "light" ? "#f5e9dc" : "#101113";
        var v = location.hash.replace(/^#\/?/, "");
        h.dataset.view = /^(work|about|contact)$/.test(v) ? v : "home";
      })();
    </script>
